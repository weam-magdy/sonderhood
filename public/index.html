    <style>
      /* The readable page the build writes into #root for crawlers and slow connections; the app replaces it. */
      .ssr { min-height: 100%; background: #FFFDF4; color: #464834; font: 16px/1.65 'DM Sans', Arial, sans-serif; }
      .ssr a { color: #464834; }
      .ssr-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 20px 7%; border-bottom: 1px solid #E8E2C4; }
      .ssr-brand { font: 28px Raglika, Georgia, serif; letter-spacing: 0.04em; text-decoration: none; text-transform: uppercase; }
      .ssr-nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; letter-spacing: 0.06em; }
      .ssr-main { max-width: 960px; padding: 48px 7% 24px; }
      .ssr h1 { margin: 0 0 20px; font: 400 clamp(30px, 4vw, 52px)/1.1 Raglika, Georgia, serif; text-transform: uppercase; }
      .ssr h2 { margin: 40px 0 12px; font: 400 clamp(22px, 2.4vw, 30px)/1.2 Raglika, Georgia, serif; text-transform: uppercase; }
      .ssr p, .ssr li, .ssr blockquote { max-width: 46em; color: #5B5D45; }
      .ssr p { margin: 0 0 14px; }
      .ssr ul { padding-left: 20px; }
      .ssr details { padding: 10px 0; border-bottom: 1px solid #E8E2C4; }
      .ssr summary { cursor: pointer; font-weight: 700; }
      .ssr-meta { font-size: 14px; letter-spacing: 0.04em; }
      .ssr-cta { margin-top: 32px; }
      .ssr-btn { display: inline-block; margin-right: 12px; padding: 12px 22px; border-radius: 999px; background: #25D366; color: #FFFFFF !important; font-weight: 700; text-decoration: none; }
      .ssr-foot { padding: 24px 7% 40px; border-top: 1px solid #E8E2C4; font-size: 14px; }
