<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Home page defaults. `npm run build` rewrites these tags for every page from src/seo/meta.mjs. -->
    <title>Therapists in New Cairo &amp; Online Therapy in Egypt | The Sonder Hood</title>
    <meta name="description" content="Psychotherapy in Arabic, English or French for adults, couples, families and teens, face to face in New Cairo or online across Egypt. Book on WhatsApp." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.the-sonderhood.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Sonder Hood" />
    <meta property="og:title" content="Therapists in New Cairo &amp; Online Therapy in Egypt | The Sonder Hood" />
    <meta property="og:description" content="Psychotherapy in Arabic, English or French for adults, couples, families and teens, face to face in New Cairo or online across Egypt. Book on WhatsApp." />
    <meta property="og:url" content="https://www.the-sonderhood.com/" />
    <meta property="og:image" content="https://www.the-sonderhood.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#464834" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // The build draws the cookie notice into every page (scripts/prerender.mjs). This
      // hides it before the first paint for visitors who have already chosen (the same
      // record and 12 months as src/analytics.js), and its buttons store a choice the
      // same way before the app has loaded; the app reads it when it starts.
      try {
        var saved = JSON.parse(localStorage.getItem('sonderhood-analytics') || 'null');
        if (saved && saved.choice && Date.now() - saved.date < 365 * 864e5) document.documentElement.className += ' consent-chosen';
      } catch (e) {}
      // Kept in memory too, for browsers that block storage. Once the app runs it
      // replaces this function with its own (src/analytics.js).
      function sonderhoodChoose(choice) {
        window.sonderhoodChoice = choice;
        try { localStorage.setItem('sonderhood-analytics', JSON.stringify({ choice: choice, date: Date.now() })); } catch (e) {}
        document.documentElement.className += ' consent-chosen';
      }
    </script>
    <style>
      /* The readable page the build writes into #root for crawlers and slow connections; the app replaces it. */
      .ssr { min-height: 100%; background: #FFFDF4; color: #464834; font: 16px/1.65 'DM Sans', Arial, sans-serif; }
      .ssr a { color: #464834; }
      .ssr-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 20px 7%; border-bottom: 1px solid #E8E2C4; }
      .ssr-brand { font: 28px Raglika, Georgia, serif; letter-spacing: 0.04em; text-decoration: none; text-transform: uppercase; }
      .ssr-nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; letter-spacing: 0.06em; }
      .ssr-main { max-width: 960px; padding: 48px 7% 24px; }
      .ssr h1 { margin: 0 0 20px; font: 400 clamp(30px, 4vw, 52px)/1.1 Raglika, Georgia, serif; text-transform: uppercase; }
      .ssr h2 { margin: 40px 0 12px; font: 400 clamp(22px, 2.4vw, 30px)/1.2 Raglika, Georgia, serif; text-transform: uppercase; }
      .ssr p, .ssr li, .ssr blockquote { max-width: 46em; color: #5B5D45; }
      .ssr p { margin: 0 0 14px; }
      .ssr ul { padding-left: 20px; }
      .ssr details { padding: 10px 0; border-bottom: 1px solid #E8E2C4; }
      .ssr summary { cursor: pointer; font-weight: 700; }
      .ssr-meta { font-size: 14px; letter-spacing: 0.04em; }
      .ssr-cta { margin-top: 32px; }
      .ssr-btn { display: inline-block; margin-right: 12px; padding: 12px 22px; border-radius: 999px; background: #25D366; color: #FFFFFF !important; font-weight: 700; text-decoration: none; }
      .ssr-foot { padding: 24px 7% 40px; border-top: 1px solid #E8E2C4; font-size: 14px; }
      .consent-chosen .ssr-consent { display: none; }
      /* The home page's first screen, drawn with the app's own classes. Up to 900px wide the app shows a menu button instead of the top menu. */
      .ssr-hero-menu { display: none; }
      @media (max-width: 900px) {
        [data-prerendered-hero] .HomeHeaderContainer { display: none; }
        .ssr-hero-menu { display: inline-flex; box-sizing: border-box; align-self: flex-start; align-items: center; justify-content: center; min-width: 64px; margin: 5%; padding: 6px 8px; color: #464834; }
      }
    </style>
    <!-- Without JavaScript there is no Analytics to agree to, and the notice could not be closed. -->
    <noscript><style>.ssr-consent { display: none; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
